[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nev-research-agent"
version = "0.1.0"
description = "NEV industry research agent (KB + web, S2 multi-agent)"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps: install from requirements.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
