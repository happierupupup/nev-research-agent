# 检索金标 v2（RAG 方案对照用）
#
# 约定：
# - 文件级相关：chunk.source 落在 relevant 即命中
# - 标注依据 = 文档主题是否能回答该问，**禁止**按某次检索结果回标
# - 冻结本文件后再试：查询改写 / 混合检索 / rerank；每次只改一处，重跑评测比 P@k、R@k
# - 旧版 10 题保留为 qrels.yaml（兼容）；本文件为扩题集
#
# 指标：P@k≈准确率，R@k≈召回率，Hit@k；默认 k=5（语料更大）

